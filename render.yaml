{
  "$schema": "https://render.com/schema/render.yaml.json",
  "services": [
    {
      "type": "web",
      "name": "macfiesta-pro-api",
      "runtime": "python",
      "rootDir": "backend",
      "buildCommand": "bash build.sh",
      "startCommand": "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120",
      "envVars": [
        {
          "key": "PYTHON_VERSION",
          "value": "3.12.8"
        },
        {
          "key": "DEBUG",
          "value": "false"
        },
        {
          "key": "SECRET_KEY",
          "generateValue": true
        },
        {
          "key": "DATABASE_URL",
          "sync": false
        },
        {
          "key": "FRONTEND_BASE_URL",
          "value": "https://macfiesta.vercel.app"
        },
        {
          "key": "ALLOWED_HOSTS",
          "value": "macfiesta-pro-api.onrender.com,.onrender.com"
        },
        {
          "key": "CORS_ALLOWED_ORIGINS",
          "value": "https://macfiesta.vercel.app,https://joelzacharia.github.io"
        },
        {
          "key": "CSRF_TRUSTED_ORIGINS",
          "value": "https://macfiesta.vercel.app,https://joelzacharia.github.io,https://macfiesta-pro-api.onrender.com"
        },
        {
          "key": "HOSTEL_PAYMENT_ACCOUNT_NAME",
          "value": "MACFAST HOSTELS"
        },
        {
          "key": "HOSTEL_PAYMENT_UPI_ID",
          "value": "macfast12230qr@fbl"
        },
        {
          "key": "EMAIL_BACKEND",
          "value": "django.core.mail.backends.smtp.EmailBackend"
        },
        {
          "key": "EMAIL_HOST",
          "value": "smtp.gmail.com"
        },
        {
          "key": "EMAIL_PORT",
          "value": "587"
        },
        {
          "key": "EMAIL_USE_TLS",
          "value": "true"
        },
        {
          "key": "EMAIL_USE_SSL",
          "value": "false"
        },
        {
          "key": "EMAIL_HOST_USER",
          "value": "macfiesta@macfast.org"
        },
        {
          "key": "EMAIL_HOST_PASSWORD",
          "sync": false
        },
        {
          "key": "DEFAULT_FROM_EMAIL",
          "value": "macfiesta@macfast.org"
        }
      ]
    }
  ]
}
